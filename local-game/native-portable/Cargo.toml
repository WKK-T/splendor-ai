[package]
name = "splendor-portable-search"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
crate-type = ["cdylib"]
[dependencies]
splendor-core = { package = "splendor-noble-core", path = "core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
[profile.release]
lto = true
opt-level = 3
panic = "abort"
