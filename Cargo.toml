[workspace]
resolver = "2"
members = ["crates/splendor-core", "crates/splendor-py", "crates/splendor-wasm"]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# default-features = false drops os_rng/getrandom: everything is seeded, and
# this keeps the wasm32 build free of platform randomness requirements.
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = "0.9"
